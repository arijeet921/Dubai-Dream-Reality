<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai-Dream-Reality</title>
        <!-- bootstrap link -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- bootstrap link end -->
        <!-- remixicon link -->
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
        <!-- remixicon link end -->
        <!-- css links -->
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- navbar start -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="./assets/image/logo.png" alt="Dubai Dream Realty Logo" style="height: 25px;">
              
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-3">  <!-- Added me-3 (margin-right) -->
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#">About us</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#">Development</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#">Locations</a>
                    </li>
                    <li class="nav-item">  <!-- No margin on last item -->
                        <a class="nav-link" href="#">Contact us</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center phone-number ml-3">
                    <a href="#" class="website-link">+<i class="ri-phone-fill"></i> 91 1234 5678</a>
                    <div class="social-icons">
                        <a href="#"><i class="ri-facebook-fill"></i></a>
                        <a href="#"><i class="ri-twitter-fill"></i></a>
                        <a href="#"><i class="ri-linkedin-fill"></i></a>
                        <a href="#"><i class="ri-instagram-line"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
     <!-- navbar end -->
    <!-- hero section start -->
    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h3 class="fw-bold mb-4">Find Your Dream Realty in Dubai</h3>
                    <p class="lead mb-5">We actively engage in initiatives that contribute to the betterment of the local community, creating a positive impact beyond real estate transactions!</p>
                </div>
                <div class="col-lg-4">
                    <div class="contact-form">
                        <h3 class="mb-4">Get In Touch</h3>
                        <div class="underline mb-3"></div>
                        
                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control-custom" id="name" placeholder="Name">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control-custom" id="email" placeholder="Email Us">
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control-custom" id="city" placeholder="City">
                            </div>
                            <div class="mb-3">
                                <input type="tel" class="form-control-custom" id="contact" placeholder="Contact No">
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control-custom" id="message" rows="3" placeholder="Enter Message"></textarea>
                            </div>
                            <button type="submit" class="btn btn-submit">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- hero section end -->
    
    <!-- bootstrap cdn js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
